<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask The Times</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111;
      --muted: #8e8e93;
      --line: #e5e5ea;
      --link: #007aff;
      --good: #248a3d;
      --warn: #c93400;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.35;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--link); }
    .stage {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    .device {
      width: 390px;
      height: min(844px, calc(100vh - 56px));
      height: min(844px, calc(100dvh - 56px));
    }
    .bezel {
      height: 100%;
      padding: 12px;
      border-radius: 52px;
      background: #0b0b0c;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45), inset 0 0 0 2px #2a2a2c;
    }
    .screen {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 40px;
      background: #fff;
    }
    .status-bar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: 54px;
      padding: 14px 26px 0;
      font-size: 15px;
      font-weight: 650;
      flex: 0 0 auto;
    }
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      width: 108px;
      height: 32px;
      transform: translateX(-50%);
      background: #000;
      border-radius: 20px;
    }
    .glyphs { display: flex; gap: 6px; align-items: center; }
    .glyphs svg { display: block; }
    .nav {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 2px 6px 10px;
      border-bottom: 0.5px solid var(--line);
      background: rgba(255, 255, 255, .94);
      flex: 0 0 auto;
    }
    .icon-btn {
      width: 44px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--link);
      display: grid;
      place-items: center;
    }
    .contact { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #121212;
      color: #fff;
      display: grid;
      place-items: center;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 700;
      font-size: 18px;
    }
    .contact strong { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .status { font-size: 11px; color: var(--muted); }
    .status[data-state="active"] { color: var(--good); }
    .status[data-state="awaiting"], .status[data-state="paused"] { color: var(--warn); }
    .launcher, #inbox, #conversation, #prefs { flex: 1; min-height: 0; }
    .launcher[hidden], #inbox[hidden], #conversation[hidden], #prefs[hidden] { display: none !important; }
    #conversation { display: flex; flex-direction: column; }
    .launcher {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 22px 18px;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, .75), transparent 28%),
        linear-gradient(180deg, #d7e7f4 0%, #edf3ea 48%, #d5e2cf 100%);
    }
    .lock-clock { font-size: 78px; font-weight: 600; letter-spacing: -2px; line-height: .9; }
    .lock-date { margin-top: 6px; color: #3a3a3c; font-size: 18px; font-weight: 550; }
    .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 8px; }
    .app-launch {
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #111;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .4);
    }
    .app-glyph {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .16);
    }
    .app-glyph.sms { background: linear-gradient(180deg, #5fe07a, #2fbf4d); }
    .app-glyph.whatsapp { background: #25d366; border-radius: 50%; }
    .app-glyph.gmail { background: #fff; }
    .thread {
      flex: 1;
      overflow: auto;
      padding: 12px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fff;
    }
    .stamp { align-self: center; color: var(--muted); font-size: 12px; font-weight: 500; margin: 4px 0 6px; }
    .bubble { max-width: 78%; font-size: 16px; }
    .bubble.reader {
      align-self: flex-end;
      background: #007aff;
      color: #fff;
      border-radius: 18px 18px 5px 18px;
      padding: 8px 12px;
    }
    .bubble.times {
      align-self: flex-start;
      background: #e9e9eb;
      color: #111;
      border-radius: 18px 18px 18px 5px;
      padding: 8px 12px;
      max-width: 82%;
    }
    .typing { display: flex; gap: 4px; align-items: center; min-width: 52px; min-height: 22px; }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8e8e93;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .card {
      align-self: stretch;
      background: #f2f2f7;
      border-radius: 18px;
      padding: 12px;
    }
    .card h2, .sheet h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 18px; line-height: 1.2; margin: 0 0 8px; }
    .card p, .sheet p { margin: 0 0 8px; }
    .meta { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
    .toggle { display: flex; gap: 4px; margin-bottom: 10px; background: #e5e5ea; border-radius: 9px; padding: 2px; }
    .toggle button {
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .toggle button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
    .plain {
      border: 0;
      background: #fff;
      color: var(--link);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
    }
    .plain.primary { background: #007aff; color: #fff; }
    .quote { margin: 0 0 10px; font-family: "Source Serif 4", Georgia, serif; font-size: 16px; }
    .story { display: grid; grid-template-columns: 72px 1fr; gap: 8px; padding: 8px 0; border-top: 0.5px solid #d8d8de; }
    .story img { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; background: #e5e5ea; }
    .story h3 { margin: 0; font-size: 14px; line-height: 1.25; font-weight: 650; }
    .story p { margin: 2px 0 0; color: #636366; font-size: 12px; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .composer { background: #f6f6f6; border-top: 0.5px solid #d1d1d6; padding: 8px 10px 0; flex: 0 0 auto; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 8px; scrollbar-width: none; }
    .chips:empty { display: none; }
    .chips button {
      flex: 0 0 auto;
      border: 0;
      background: #fff;
      color: var(--link);
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 0 0 0.5px #d1d1d6;
    }
    .composer form { display: flex; align-items: flex-end; gap: 8px; }
    textarea {
      flex: 1;
      resize: none;
      min-height: 36px;
      max-height: 88px;
      border: 0;
      border-radius: 18px;
      padding: 8px 14px;
      background: #fff;
      box-shadow: inset 0 0 0 0.5px #c7c7cc;
    }
    .send {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #007aff;
      color: #fff;
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      margin-bottom: 2px;
    }
    .send:disabled, textarea:disabled { opacity: .45; }
    .home { height: 28px; display: grid; place-items: center; }
    .home span { width: 128px; height: 5px; border-radius: 3px; background: #111; }
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 72%;
      overflow: auto;
      background: #f2f2f7;
      border-radius: 18px 18px 0 0;
      padding: 8px 14px 24px;
      z-index: 4;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, .2);
    }
    .sheet[hidden] { display: none; }
    .sheet-handle { width: 36px; height: 5px; border-radius: 3px; background: #c7c7cc; margin: 4px auto 10px; }
    .sheet-top { display: flex; justify-content: space-between; align-items: center; }
    .facts { display: grid; grid-template-columns: 88px 1fr; gap: 6px 8px; margin: 8px 0 12px; font-size: 13px; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; vertical-align: top; padding: 6px 4px; border-top: 0.5px solid #d8d8de; }
    th { color: var(--muted); font-weight: 600; }
    .in { color: var(--good); font-weight: 650; }
    .out { color: var(--muted); }
    .log { list-style: none; padding: 0; margin: 0; font-size: 13px; }
    .log li { padding: 7px 0; border-top: 0.5px solid #d8d8de; }
    .note { color: #636366; font-size: 13px; }
    .channel-note { padding: 9px 10px; border-radius: 10px; background: #fff; color: #636366; font-size: 12px; }
    label.inline { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
    input[type="number"], input[type="date"] { border: 0; border-radius: 8px; padding: 6px 8px; background: #fff; }
    #inbox { overflow: auto; background: #fff; }
    .list-top, .wa-top, .gmail-top { display: flex; align-items: center; gap: 8px; }
    .list-top { padding: 8px 16px 0; }
    .list-top h1 { flex: 1; margin: 0; font-size: 34px; letter-spacing: -0.6px; }
    .search-pill, .gmail-search {
      margin: 10px 16px;
      border-radius: 12px;
      background: #f2f2f7;
      color: #8e8e93;
      padding: 9px 12px;
      font-size: 16px;
    }
    .thread-row, .wa-row, .gmail-row {
      width: 100%;
      border: 0;
      background: transparent;
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 10px;
      align-items: center;
      text-align: left;
      padding: 12px 16px;
      border-top: 0.5px solid #ececec;
    }
    .thread-row strong, .wa-row strong, .gmail-row strong { display: block; font-size: 16px; }
    .thread-row p, .wa-row p, .gmail-row p { margin: 2px 0 0; color: #8e8e93; font-size: 14px; }
    .thread-row time, .wa-row time, .gmail-row time { color: #8e8e93; font-size: 12px; }
    .row-avatar {
      width: 46px; height: 46px; border-radius: 50%; background: #121212; color: #fff;
      display: grid; place-items: center; font-family: "Source Serif 4", Georgia, serif; font-size: 22px;
    }
    .wa-top { height: 58px; padding: 0 16px; background: #008069; color: #fff; font-size: 22px; font-weight: 650; }
    .wa-top button, .gmail-top button, .list-top button { border: 0; background: transparent; color: inherit; font-weight: 650; }
    .wa-filters { display: flex; gap: 8px; padding: 10px 16px; background: #fff; }
    .wa-filters span { border-radius: 16px; padding: 6px 12px; background: #f0f2f5; font-size: 14px; }
    .wa-filters .on { background: #d8fdd2; color: #008069; font-weight: 700; }
    .gmail-top { height: 64px; padding: 0 8px 0 4px; }
    .gmail-search { display: flex; align-items: center; gap: 10px; flex: 1; margin: 0; background: #eef3fd; color: #444; }
    .gmail-tabs { display: flex; border-bottom: 1px solid #e8eaed; }
    .gmail-tabs button { flex: 1; border: 0; background: transparent; padding: 12px 4px; color: #5f6368; font-size: 13px; font-weight: 650; }
    .gmail-tabs button[aria-pressed="true"] { color: #0b57d0; box-shadow: inset 0 -3px 0 #0b57d0; }
    .gmail-letter { padding: 8px 16px 24px; }
    .gmail-letter h1 { margin: 16px 0 8px; font-size: 22px; line-height: 1.25; }
    .email-footer { margin-top: 18px; padding-top: 12px; border-top: 1px solid #dadce0; color: #5f6368; font-size: 11px; line-height: 1.45; }
    .email-footer p { margin: 0 0 6px; }
    .email-footer button { border: 0; padding: 0; background: none; color: #5f6368; font-size: 11px; text-decoration: underline; }
    #prefs {
      --ink: #121212;
      --muted: #666;
      --line: #ddd;
      --accent: #326891;
      --ok: #267c30;
      --ok-soft: #e8f5e9;
      --danger: #d0021b;
      overflow: auto;
      background: #f0f0f0;
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }
    #prefs .up-back {
      position: sticky; top: 0; z-index: 2; display: block; width: 100%; text-align: left;
      border: 0; border-bottom: 1px solid var(--line); background: #f0f0f0; color: var(--accent);
      font-weight: 700; font-size: 13px; padding: 10px 14px;
    }
    #prefs .up-lead { padding: 14px 14px 4px; }
    #prefs .up-rest { padding: 4px 14px 28px; }
    #prefs .up-brand { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    #prefs h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
    #prefs .up-lede { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    #prefs .up-success { background: var(--ok-soft); border: 1px solid #b7dfbc; border-left: 3px solid var(--ok); border-radius: 2px; padding: 10px 12px; margin: 0 0 12px; }
    #prefs .up-success strong { display: block; color: var(--ok); margin-bottom: 2px; }
    #prefs .up-success p { margin: 0; }
    #prefs .snapshot { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    #prefs .snapshot span { font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; padding: 4px 8px; border-radius: 2px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
    #prefs .snapshot em { font-style: normal; color: var(--ok); font-weight: 700; }
    #prefs .section-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
    #prefs .section-note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
    #prefs .beta-tag { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; border-radius: 2px; margin-left: 6px; vertical-align: middle; }
    #prefs .sub-card, #prefs .drawer, #prefs .text-row, #prefs .discover-card { background: #fff; border: 1px solid var(--line); border-radius: 2px; }
    #prefs .sub-card { overflow: hidden; margin-bottom: 8px; }
    #prefs .sub-card.is-pilot { border-left: 3px solid var(--accent); }
    #prefs .sub-card.is-pilot .sub-main { cursor: default; }
    #prefs .sub-card.is-expanded { border-color: var(--accent); }
    #prefs .sub-main, #prefs .compact-main, #prefs .drawer-toggle, #prefs .discover-card, #prefs .text-row button, #prefs .choice {
      font-family: inherit; text-align: left; cursor: pointer;
    }
    #prefs .sub-main { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; width: 100%; padding: 12px; border: 0; background: transparent; color: inherit; }
    #prefs .sub-kicker { margin: 0 0 4px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
    #prefs .sub-title { margin: 0 0 4px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    #prefs .sub-blurb { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
    #prefs .sub-meta { display: flex; flex-wrap: wrap; gap: 4px; }
    #prefs .sub-meta span, #prefs .compact-meta { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    #prefs .sub-meta span { padding: 2px 6px; border-radius: 2px; background: #f5f5f5; border: 1px solid var(--line); color: var(--muted); }
    #prefs .sub-meta .is-on { color: var(--ok); border-color: #b7d7bb; background: var(--ok-soft); }
    #prefs .sub-cta, #prefs .compact-cta, #prefs .discover-cta { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
    #prefs .sub-cta { padding: 6px 10px; border-radius: 2px; border: 1px solid var(--accent); background: #fff; white-space: nowrap; }
    #prefs .sub-panel, #prefs .compact-panel { display: none; padding: 0 12px 12px; border-top: 1px solid var(--line); background: #fafafa; }
    #prefs .is-expanded .sub-panel, #prefs .is-expanded .compact-panel { display: block; }
    #prefs .choice { display: block; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px; margin: 8px 0 0; color: var(--ink); }
    #prefs .choice.is-current { border-color: var(--accent); background: #e8f0f6; }
    #prefs .choice.is-danger { color: var(--danger); }
    #prefs .choice:disabled { opacity: .45; cursor: not-allowed; }
    #prefs .choice strong { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    #prefs .choice span, #prefs .text-row span, #prefs .discover-copy span, #prefs .compact-meta { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
    #prefs .compact-meta .is-on { color: var(--ok); font-weight: 700; }
    #prefs .compact-meta .is-warn { color: #b85c00; font-weight: 700; }
    #prefs .find-row input { width: 100%; font-family: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid #bbb; border-radius: 2px; background: #fff; color: var(--ink); margin-bottom: 8px; }
    #prefs .drawer { margin-bottom: 8px; overflow: hidden; }
    #prefs .drawer-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 10px 12px; border: 0; background: #fafafa; color: inherit; }
    #prefs .drawer-toggle strong { display: block; font-size: 13px; font-weight: 600; }
    #prefs .drawer-toggle span { font-size: 12px; color: var(--muted); }
    #prefs .drawer-chevron { flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); padding: 4px 8px; border: 1px solid var(--line); border-radius: 2px; background: #fff; }
    #prefs .drawer-body { display: none; border-top: 1px solid var(--line); }
    #prefs .drawer.is-open .drawer-body { display: block; }
    #prefs .compact-row { border-bottom: 1px solid var(--line); }
    #prefs .compact-row:last-child { border-bottom: 0; }
    #prefs .compact-main { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 8px 12px; border: 0; background: transparent; color: inherit; }
    #prefs .compact-row.is-expanded .compact-main { background: #e8f0f6; }
    #prefs .compact-title { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
    #prefs .text-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; margin-bottom: 6px; }
    #prefs .text-row strong { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    #prefs .text-row .door { margin: 4px 0 0; font-size: 11px; color: #b85c00; }
    #prefs .text-row button, #prefs .push-manage { font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 2px; border: 1px solid var(--accent); padding: 6px 12px; background: var(--accent); color: #fff; }
    #prefs .text-row button.is-on, #prefs .push-manage { background: #fff; color: var(--accent); }
    #prefs .discover-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 16px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    #prefs .discover-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
    #prefs .discover-head p { margin: 0; font-size: 12px; color: var(--muted); }
    #prefs .discover-card { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 8px; margin-bottom: 6px; color: inherit; border: 1px solid var(--line); }
    #prefs .discover-card.is-open { border-color: var(--accent); background: #e8f0f6; }

    const textChannels = {

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([key, value]) => {
        if (value == null) return;
        if (key === "class") node.className = value;
        else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2).toLowerCase(), value);
        else node.setAttribute(key, value);
      });
      [].concat(children).forEach(child => {
        if (child == null || child === false) return;
        node.append(child.nodeType ? child : document.createTextNode(String(child)));
      });
      return node;
    }

    function formatDate(iso) {
      if (!iso) return "Date unavailable";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "Date unavailable";
      return `${MONTHS[date.getUTCMonth()]} ${date.getUTCDate()}, ${date.getUTCFullYear()}`;
    }

    function ageDays(iso, now) {
      if (!iso) return null;
      const ms = new Date(now) - new Date(iso);
      return Number.isNaN(ms) ? null : Math.floor(ms / 86400000);
    }

    function freshestAge(article, now) {
      const ages = [ageDays(article.firstPublished, now), ageDays(article.lastModified, now)].filter(age => age != null);
      return ages.length ? Math.min(...ages) : null;
    }

    function isRecent(article, now) {
      const age = freshestAge(article, now);
      return age != null && age <= windowDays;
    }

    function aboutParis(article) {
      return /\b(?:paris|france|french)\b/i.test(`${article.title} ${article.summary}`);
    }

    function canText(article, now) {
      if (!isRecent(article, now) || !aboutParis(article)) return false;
      return /\b(?:europe|protest|strike|transit|disrupt|blockade|rally|unrest|crisis)\b/i.test(`${article.section} ${article.title} ${article.summary}`);
    }

    function dayLabel(age) {
      if (age == null) return "age unavailable";
      return `${age} ${age === 1 ? "day" : "days"}`;
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname;
        if (parsed.protocol === "https:" && (host.endsWith("nytimes.com") || host.endsWith("nyt.com"))) return parsed.href;
      } catch (error) {}
      return "";
    }

    function wantsFollowUp(text) {
      const value = text.toLowerCase();
      if (/\b(?:do not|don't|dont)\s+text\b/.test(value)) return false;
      return /\b(?:text me|send me|email me|whatsapp me|keep me|follow up|until i|posted|updates)\b/.test(value);
    }

    function channelConfig() {
      return CHANNELS[service.channel];
    }

    function rememberSession() {
      const session = sessions[activeChannel];
      session.latest = latest;
      session.confirmationSequence = confirmationSequence;
    }

    function useSession(channel) {
      rememberSession();
      activeChannel = channel;
      const session = sessions[channel];
      thread = session.thread;
      service = session.service;
      latest = session.latest;
      confirmationSequence = session.confirmationSequence;
    }

    function openApp(channel) {
      if (busy || !sessions[channel]) return;
      useSession(channel);
      view = "list";
      render();
    }

    function openThread() {
      view = "thread";
      render();
    }

    function goBack() {
      if (busy) return;
      if (view === "list" && gmailLetter) {
        gmailLetter = null;
        render();
        return;

      view = view === "thread" ? "list" : "home";
      document.querySelector("#sheet").hidden = true;
      document.querySelector("#info").setAttribute("aria-expanded", "false");
      render();

    function planQueries(text) {
      const value = text.toLowerCase();
      const paris = value.includes("paris") || service.scope.toLowerCase().includes("paris");
      if (!paris) {
        const words = text.match(/[A-Za-z0-9’']+/g) || ["paris", "travel"];
        return [words.slice(0, 12).join(" ")];
      }
      const queries = ["paris travel"];
      if (/\b(?:protest|transit|disrupt|changed|current|strike|update|news)\b/.test(value) || service.state === "active") {
        queries.push("paris protests", "paris transit");
      }
      return queries;
    }

    function merge(searches) {
      const byPath = new Map();
      searches.forEach(search => {
        search.articles.forEach(article => {
          const key = new URL(article.url).pathname;
          const existing = byPath.get(key);
          if (existing) existing.queries.push(search.query);
          else byPath.set(key, { ...article, queries: [search.query] });
        });
      });
      return [...byPath.values()];
    }

    let bundled = null;

    async function loadBundled() {
      if (bundled) return bundled;
      const response = await fetch("catalog.json");
      if (!response.ok) throw new Error("Search is unavailable.");
      bundled = await response.json();
      return bundled;
    }

    async function retrieve(queries) {
      try {
        const params = new URLSearchParams();
        queries.forEach(query => params.append("q", query));
        const response = await fetch(`/api/retrieve?${params}`);
        if (response.ok) {
          const payload = await response.json();
          if (payload.searches && payload.searches.length) return payload;
        }
      } catch (error) {}
      const catalog = await loadBundled();
      const byQuery = new Map(catalog.searches.map(search => [search.query, search]));
      const searches = queries.map(query => byQuery.get(query)).filter(Boolean);

      const channel = channelConfig();
      const end = service.endDate ? ` or ${formatDate(service.endDate + "T00:00:00Z")}, whichever is first` : "";
      return {
        none: channel.key === "whatsapp" ? "online" : channel.key === "email" ? "nytimes.com" : "Text Message",
        awaiting: "Reply to confirm",
        active: `${service.preference === "less-often" ? "Less often" : "Updates"} until you're home${end}`,
        paused: "Paused",
        cancelled: service.preference === "one-time" ? "One answer" : "Stopped"
      }[service.state];
    }

    function currentConsent(preference) {
      return {
        at: service.consent?.at || new Date().toISOString(),
        channel: service.channel,
        scope: service.scope,
        cadence: service.cadence,
        end: service.end,
        endDate: service.endDate,
        windowDays,
        preference
      };
    }

    function rememberConsent(preference) {
      const confirmation = thread.find(message => message.type === "confirm" && message.id === service.pendingConfirmationId);
      service.preference = preference;
      service.consent = currentConsent(preference);
      if (confirmation) confirmation.snapshot = { ...service.consent };
    }

    function beginAutomation() {
      service.state = "active";
      service.preference = "automated";
      service.cadence = "Automatically, whenever a retrieved story is new during this period";
      service.pendingConfirmationId = ++confirmationSequence;
      thread.push({ type: "confirm", id: service.pendingConfirmationId, snapshot: null });
      rememberConsent("automated");
      addLog("Automated", "Baseline alerting is on for this period. No override yet.");
    }

    function chooseOneTime(alreadySpoken) {
      if (service.state !== "active" && service.state !== "paused") return;
      if (!alreadySpoken) thread.push({ type: "reader", text: "Just this answer." });
      service.cadence = "One-time answer. Automated updates are off.";
      rememberConsent("one-time");
      const confirmation = thread.find(message => message.type === "confirm" && message.id === service.pendingConfirmationId);
      if (confirmation) confirmation.closed = true;
      service.pendingConfirmationId = null;
      service.state = "cancelled";
      thread.push({ type: "times", text: `Understood. This stays a one-time answer, so I will not send more ${channelConfig().plural} about this period.` });
      addLog("Override", "One-time preference replaced automated alerting.");
      render();
    }

    function pauseService() {
      if (service.state !== "active") return;
      service.state = "paused";
      thread.push({ type: "times", text: `Paused. I will not send another ${channelConfig().noun} until you say resume.` });
      addLog("Suppressed", "Reader paused the service.");
      render();
    }

    function resumeService() {
      if (service.state !== "paused") return;
      service.state = "active";
      thread.push({ type: "times", text: "Resumed, on the same scope and end. I still send only when there is a meaningful update." });
      addLog("No send", "Reader resumed the service.");
      render();
    }

    function stopService() {
      if (service.state !== "active" && service.state !== "paused") return;
      service.cadence = "Stopped. Automated updates are off.";
      rememberConsent("stopped");
      const confirmation = thread.find(message => message.type === "confirm" && message.id === service.pendingConfirmationId);
      if (confirmation) confirmation.closed = true;
      service.pendingConfirmationId = null;
      service.state = "cancelled";
      thread.push({ type: "times", text: `Stopped. I will not send ${channelConfig().plural} about this trip. You can still ask a one-time question.` });
      addLog("Suppressed", "Reader stopped the service. Queued sends are cancelled.");
      render();
    }

    function lessen() {
      if ((service.state !== "active" && service.state !== "paused") || service.preference === "less-often") return;
      service.cadence = "Opted down: at most once a week during this period, and only when a story is new";
      rememberConsent("less-often");
      thread.push({ type: "times", text: `Less often replaces the automatic cadence. I will send at most one ${channelConfig().noun} a week during this period, and only when there is a meaningful update.` });
      addLog("Override", "Opt-down replaced the automatic cadence. Alerting stays on.");
      render();
    }

    function storyNode(article, now) {
      const publishedAge = ageDays(article.firstPublished, now);
      const updatedAge = ageDays(article.lastModified, now);
      const updatedLater = updatedAge != null && publishedAge != null && updatedAge + 1 < publishedAge;
      const freshness = updatedLater
        ? `Updated ${formatDate(article.lastModified)} · ${dayLabel(updatedAge)}`
        : `${formatDate(article.firstPublished)} · ${dayLabel(publishedAge)}`;
      const url = safeUrl(article.url);
      const image = safeUrl(article.image);
      return el("article", { class: "story" }, [
        image ? el("img", { src: image, alt: "" }) : el("div"),
        el("div", {}, [
          el("div", { class: "meta" }, article.section || "Times"),
          el("h3", {}, [url ? el("a", { href: url, target: "_blank", rel: "noopener" }, article.title) : article.title]),
          el("p", {}, `${article.byline ? article.byline + " · " : ""}${freshness}`),
          article.summary ? el("p", {}, article.summary) : null,
          el("p", { class: canText(article, now) ? "in" : "out" }, canText(article, now) ? "Recent enough to cite in an update" : "Not a trip update")
        ])
      ]);
    }

    function renderBrief(message) {
      const now = message.data.now;
      const guideQuery = message.data.searches[0].query;
      const guide = message.articles.filter(article => article.queries.includes(guideQuery));
      const lead = guide[0] || message.articles[0];
      const rest = guide.slice(1, 4);
      const disruption = message.articles.filter(article => article.queries.some(query => query !== guideQuery) && aboutParis(article));
      const recent = disruption.filter(article => canText(article, now));
      const omitted = message.articles.filter(article => article.queries.some(query => query !== guideQuery) && !aboutParis(article)).length;
      const closest = disruption
        .map(article => ({ article, age: freshestAge(article, now) }))
        .filter(item => item.age != null)
        .sort((a, b) => a.age - b.age)[0];
      const card = el("div", { class: "card" });
      card.append(el("div", { class: "meta" }, "From Times reporting"));
      card.append(el("div", { class: "toggle" }, [
        el("button", { type: "button", "aria-pressed": message.mode === "brief" ? "true" : "false", onclick: () => { message.mode = "brief"; render(); } }, "Grounded brief"),
        el("button", { type: "button", "aria-pressed": message.mode === "links" ? "true" : "false", onclick: () => { message.mode = "links"; render(); } }, "Link-led results")
      ]));
      if (message.mode === "links") {
        card.append(el("p", {}, "The same stories, without a written brief. This is the retrieval-only side of the comparison."));
        message.articles.forEach(article => card.append(storyNode(article, now)));
      } else if (lead) {
        const leadUrl = safeUrl(lead.url);
        card.append(el("h2", {}, "For the free hours, start here."));
        card.append(el("p", { class: "quote" }, [
          leadUrl ? el("a", { href: leadUrl, target: "_blank", rel: "noopener" }, lead.title) : lead.title,
          lead.summary ? ` “${lead.summary}”` : ""
        ]));
        if (rest.length) {
          card.append(el("p", {}, "Also ranked nearby:"));
          rest.forEach(article => card.append(storyNode(article, now)));
        }
        card.append(el("h2", {}, "What the protest and transit searches returned"));
        if (!message.data.searches.slice(1).length) {
          card.append(el("p", {}, "I used the planning search only. I did not run a separate protest or transit search for this question."));
        } else if (!recent.length) {
          card.append(el("p", {}, `No Paris or France story from those searches was published or updated in the last ${windowDays} days.`));
          card.append(el("p", {}, closest ? `The closest is ${closest.age} days old: ${closest.article.title}. No meaningful update, so there is nothing to send.` : "No meaningful update."));
        } else {
          card.append(el("p", {}, `There is recent Times reporting on protests in France. ${recent.length} ${recent.length === 1 ? "story is" : "stories are"} inside ${windowDays} days. I would cite these. I do not have a retrieved story that says your flights, trains, or meetings are disrupted.`));
          recent.slice(0, 3).forEach(article => card.append(storyNode(article, now)));
        }
        if (omitted) card.append(el("p", { class: "note" }, `${omitted} other search results did not mention Paris or France, so they stay out of this brief.`));
        card.append(el("p", { class: "note" }, "The sentences above point at Times stories. They do not add facts beyond those summaries."));
      } else {
        card.append(el("p", {}, "The Times did not return stories for that question."));
      }
      return card;
    }

    function renderConfirm(message) {
      const live = !message.closed && service.pendingConfirmationId === message.id && (service.state === "active" || service.state === "paused");
      const snapshot = live ? service.consent : message.snapshot;
      const channel = CHANNELS[snapshot?.channel] || channelConfig();
      const preference = snapshot?.preference || "automated";
      const heading = {
        automated: "Updates are on automatically until you say you are home.",
        "less-often": "Updates stay on, less often, until you say you are home.",
        "one-time": "You chose one answer. Automated updates are off.",
        stopped: "You stopped the updates."
      }[preference] || "Updates are on automatically until you say you are home.";
      const card = el("div", { class: "card" }, [
        el("div", { class: "meta" }, "This period"),
        el("h2", {}, heading),
        el("p", {}, `Scope: ${snapshot?.scope || service.scope}`),
        el("p", {}, `Channel: ${channel.label}. Cadence: ${(snapshot?.cadence || service.cadence).toLowerCase()}.`),
        el("p", {}, "Less often and just this answer override the automatic alerts. If you leave them, updates continue through this period. This is not a safety monitor.")
      ]);
      if (!live || preference === "one-time" || preference === "stopped") return card;
      card.append(
        el("p", { class: "channel-note" }, channel.requirement),
        el("label", { class: "inline" }, [
          "Optional end date",
          el("input", { type: "date", value: service.endDate, onchange: event => { service.endDate = event.target.value; rememberConsent(service.preference); } })
        ]),
        el("div", { class: "actions" }, [
          preference === "automated" ? el("button", { class: "plain", type: "button", onclick: () => { thread.push({ type: "reader", text: "Less often." }); lessen(); } }, "Less often") : null,
          el("button", { class: "plain", type: "button", onclick: () => chooseOneTime(false) }, "Just this answer")
        ])
      );
      return card;
    }

    function renderUpdate(message) {
      const card = el("div", { class: "card" }, [
        el("div", { class: "meta" }, "Follow-up check"),
        el("h2", {}, message.articles.length ? "Recent reporting to cite." : "No meaningful update.")
      ]);
      if (!message.articles.length) {
        card.append(el("p", {}, "I checked again. Nothing newly retrieved was published or updated inside the window, so I am not sending a trip text."));
      } else {
        card.append(el("p", {}, message.articles.length > 3 ? `Citing 3 of ${message.articles.length} stories. This is not a safety monitor.` : "This is not a safety monitor."));
        message.articles.slice(0, 3).forEach(article => card.append(storyNode(article, message.now)));
      }
      return card;
    }

    function emailFooter(productId) {
      const product = EMAIL_PRODUCTS[productId];
      return el("footer", { class: "email-footer" }, [
        el("p", {}, `You received this email because you subscribe to ${product.name}.`),
        el("p", {}, el("button", { type: "button", onclick: () => openPreferences(productId) }, `Unsubscribe from ${product.name}`)),
        el("p", {}, "The New York Times Company · 620 Eighth Avenue, New York, NY 10018")
      ]);
    }

    function renderMail(kind, content, productId) {
      const outgoing = kind === "reader";
      const article = el("article", { class: outgoing ? "mail mine" : "mail" }, [
        el("header", {}, [
          el("div", { class: "mail-avatar" }, outgoing ? "Me" : "T"),
          el("div", {}, [
            el("strong", {}, outgoing ? "Me" : "The New York Times"),
            el("span", {}, outgoing ? "to The Times" : "to me")
          ]),
          el("time", {}, "9:41 AM")
        ]),
        el("div", { class: "mail-body" }, content.nodeType ? content : String(content))
      ]);
      if (productId) article.append(emailFooter(productId));
      return article;

    function renderBubble(kind, content, label) {
      if (channelConfig().key === "email") return renderMail(kind, content, kind === "reader" ? null : "ask");
      const bubble = el("div", { class: `bubble ${kind}`, "aria-label": label || null }, content.nodeType ? content : String(content));
      if (channelConfig().key === "whatsapp" && kind !== "typing") bubble.append(el("span", { class: "wa-meta" }, kind === "reader" ? "9:41  ✓✓" : "9:41"));
      return bubble;
    }

    function renderThread() {
      threadEl.replaceChildren();
      if (channelConfig().key !== "email") threadEl.append(el("div", { class: "stamp" }, "Today 9:41 AM"));
      if (!thread.length) {
        const intro = "Ask the way you’d ask someone you trust. If you ask me to keep you current for a period, I send updates automatically until it ends. Less often or just this answer overrides that.";
        threadEl.append(renderBubble("times", intro));
      }
      thread.forEach(message => {
        if (message.type === "reader") threadEl.append(renderBubble("reader", message.text));
        if (message.type === "times") threadEl.append(renderBubble("times", message.text));
        if (message.type === "pending") {
          threadEl.append(channelConfig().key === "email"
            ? renderMail("times", "Finding Times reporting…")
            : el("div", { class: "bubble times typing", "aria-label": "The Times is typing" }, [el("span"), el("span"), el("span")]));
        }
        if (message.type === "brief") threadEl.append(channelConfig().key === "email" ? renderMail("times", renderBrief(message)) : renderBrief(message));
        if (message.type === "confirm") threadEl.append(channelConfig().key === "email" ? renderMail("times", renderConfirm(message)) : renderConfirm(message));
        if (message.type === "update") threadEl.append(channelConfig().key === "email" ? renderMail("times", renderUpdate(message)) : renderUpdate(message));
      });
      threadEl.scrollTop = threadEl.scrollHeight;
    }

    function previewText() {
      for (let index = thread.length - 1; index >= 0; index -= 1) {
        const message = thread[index];
        if (message.type === "reader" || message.type === "times") return message.text;
        if (message.type === "brief") return "A grounded brief is ready";
        if (message.type === "confirm") return "Confirm before updates start";
        if (message.type === "update") return message.articles.length ? "A new update is ready" : "No meaningful update";
      }
      return "Ask The Times what you need, where you need it";
    }

    function renderInbox() {
      const preview = previewText();
      const open = el("button", { type: "button", onclick: openThread });
      if (service.channel === "WhatsApp") {
        open.className = "wa-row";
        open.append(
          el("div", { class: "row-avatar" }, "T"),
          el("div", {}, [el("strong", {}, "The Times"), el("p", {}, preview)]),
          el("time", {}, "9:41 AM")
        );
        inboxEl.replaceChildren(
          el("div", { class: "wa-top" }, [el("button", { type: "button", onclick: goBack, "aria-label": "Back to apps" }, "‹"), "WhatsApp"]),
          el("div", { class: "wa-filters" }, [el("span", { class: "on" }, "Chats"), el("span", {}, "Updates"), el("span", {}, "Calls")]),
          open
        );
        return;

      }
      open.className = "thread-row";
      open.append(

        el("div", {}, [el("strong", {}, "The Times"), el("p", {}, preview)]),
        el("time", {}, "9:41 AM")
      );
      inboxEl.replaceChildren(
        el("div", { class: "list-top" }, [
          el("button", { type: "button", onclick: goBack, "aria-label": "Back to apps" }, "‹"),
          el("h1", {}, "Messages"),
          el("button", { type: "button", onclick: openThread, "aria-label": "New message" }, "✎")
        ]),
        el("div", { class: "search-pill" }, "Search"),
        open
      );
    }

      ]);

    function renderGmail(preview) {
      const top = el("div", { class: "gmail-top" }, [
        el("button", { type: "button", onclick: goBack, "aria-label": gmailLetter ? "Back to inbox" : "Back to apps" }, "‹"),
        el("div", { class: "gmail-search" }, gmailLetter ? gmailLetter.subject : "Search in mail")
      ]);
      if (gmailLetter) {
        inboxEl.replaceChildren(

          el("article", { class: "gmail-letter" }, [

          ])

      }
      const tabs = el("div", { class: "gmail-tabs", role: "tablist", "aria-label": "Inbox categories" },
        ["Primary", "Updates", "Promotions"].map(tab => el("button", {

        }, tab))

      const rows = gmailTab === "Primary"
        ? [gmailRow({ from: "The New York Times", subject: "Paris, when you need it", snippet: preview, time: "9:41 AM" }, openThread)]
        : GMAIL_FOLDERS[gmailTab].map(mail => gmailRow(mail, () => { gmailLetter = mail; render(); }));
      inboxEl.replaceChildren(top, tabs, ...rows);
    }

    function renderChips() {
      const chips = [];
      if (service.state === "none" || service.state === "cancelled") {
        STARTERS.forEach(starter => chips.push(el("button", { type: "button", onclick: () => send(starter.text) }, starter.label)));
      }
      if (service.state === "active") {
        chips.push(el("button", { type: "button", onclick: () => send("Anything new?") }, "Anything new?"));
        if (service.preference === "automated") chips.push(el("button", { type: "button", onclick: () => { thread.push({ type: "reader", text: "Less often." }); lessen(); } }, "Less often"));
        chips.push(el("button", { type: "button", onclick: () => chooseOneTime(false) }, "Just this answer"));
        chips.push(el("button", { type: "button", onclick: () => { thread.push({ type: "reader", text: "Pause." }); pauseService(); } }, "Pause"));
        chips.push(el("button", { type: "button", onclick: () => { thread.push({ type: "reader", text: "Stop." }); stopService(); } }, "Stop"));
      }
      if (service.state === "paused") {
        chips.push(el("button", { type: "button", onclick: () => { thread.push({ type: "reader", text: "Resume." }); resumeService(); } }, "Resume"));
        chips.push(el("button", { type: "button", onclick: () => { thread.push({ type: "reader", text: "Stop." }); stopService(); } }, "Stop"));
      }
      chipsEl.replaceChildren(...chips);

    function renderDesk() {
      const now = latest ? latest.data.now : new Date().toISOString();
      const facts = el("dl", { class: "facts" }, [
        el("dt", {}, "Service"), el("dd", {}, service.state),
        el("dt", {}, "Scope"), el("dd", {}, service.scope),
        el("dt", {}, "Channel"), el("dd", {}, service.channel),
        el("dt", {}, "Cadence"), el("dd", {}, service.cadence),
        el("dt", {}, "End"), el("dd", {}, service.endDate ? `${service.end} or ${formatDate(service.endDate + "T00:00:00Z")}` : service.end),
        el("dt", {}, "Preference"), el("dd", {}, service.preference),
        el("dt", {}, "Consent"), el("dd", {}, service.consent ? `${formatDate(service.consent.at)} · ${service.consent.channel} · ${service.consent.preference}` : "Not recorded")
      ]);
      const rule = el("p", { class: "note" }, latest ? latest.data.rule.text : "Latest News fires when there is at least 1 HIGH-relevance chunk, or at least 3 HIGH/MEDIUM-relevance chunks, published or updated within 14 days.");
      const classifier = el("p", { class: "note" }, latest ? latest.data.rule.classifier : "Ask a question to retrieve from the NAPP test.");
      const nodes = [facts, el("h2", {}, "Query signals"), rule, classifier];

        const table = el("table", {}, [

          el("tbody", {}, latest.articles.map(article => el("tr", {}, [
            el("td", {}, article.title),
            el("td", {}, formatDate(article.firstPublished)),
            el("td", {}, formatDate(article.lastModified)),
            el("td", { class: canText(article, now) ? "in" : "out" }, canText(article, now) ? "Cite" : "Hold")
          ])))
        ]);
        nodes.push(table);
      }
      nodes.push(
        el("h2", {}, "Channel implications"),
        el("p", { class: "note" }, "SMS is the baseline reach channel. It needs A2P sender registration, explicit consent, STOP/HELP, carrier delivery receipts, suppression, and segment-aware copy. MMS is optional; links and concise text are enough for this MVP."),
        el("p", { class: "note" }, "RCS should be a progressive enhancement to SMS, not a required channel. It adds verified branding, article cards, and suggested replies, but needs device capability checks and SMS fallback."),
        el("p", { class: "note" }, "WhatsApp needs a Business Platform provider, WhatsApp-specific opt-in, approved utility templates outside the 24-hour service window, quality monitoring, and market-based billing."),
        el("p", { class: "note" }, "Email needs a delivery provider, SPF/DKIM/DMARC, bounce and complaint processing, one-click unsubscribe, preference suppression, and responsive templates."),
        el("p", { class: "note" }, "Apple Messages for Business can support opted-in direct-interest updates, but requires an Apple-approved messaging service provider and Apple review. Treat it as a later iOS extension.")
      );
      nodes.push(el("h2", {}, "Send log"));
      nodes.push(service.log.length ? el("ul", { class: "log" }, service.log.map(entry => el("li", {}, `${entry.decision}: ${entry.reason}`))) : el("p", { class: "note" }, "No send has been attempted."));

    function openPreferences(productId) {
      const product = EMAIL_PRODUCTS[productId];
      preferenceReturn = view;
      preferenceProduct = productId;
      preferenceOutcome = "unsubscribed";
      preferenceChannel = "";
      prefsQuery = "";
      prefsDrawerOpen = false;
      prefsExpandedId = null;
      prefsDiscoverId = null;
      product.subscribed = false;
      product.reduced = false;
      product.paused = false;
      product.cadence = product.base;
      view = "prefs";
      render();
      prefsEl.scrollTop = 0;

    function optDownInstead() {
      const product = EMAIL_PRODUCTS[preferenceProduct];
      if (preferenceChannel && textChannels[preferenceChannel]) textChannels[preferenceChannel].on = false;
      product.subscribed = true;
      product.reduced = true;
      product.paused = false;
      product.cadence = "Weekly";
      preferenceOutcome = "opt-down";
      preferenceChannel = "";
      render();
    }

    function subscribeChannel(channel) {
      const product = EMAIL_PRODUCTS[preferenceProduct];
      product.subscribed = false;
      product.reduced = false;
      product.paused = false;
      product.cadence = product.base;
      if (preferenceChannel && preferenceChannel !== channel && textChannels[preferenceChannel]) textChannels[preferenceChannel].on = false;
      textChannels[channel].on = true;
      preferenceOutcome = "channel";
      preferenceChannel = channel;
      render();
    }

    function stopThisProduct() {
      const product = EMAIL_PRODUCTS[preferenceProduct];
      if (preferenceChannel && textChannels[preferenceChannel]) textChannels[preferenceChannel].on = false;
      product.subscribed = false;
      product.reduced = false;
      product.paused = false;
      product.cadence = product.base;
      preferenceOutcome = "unsubscribed";
      preferenceChannel = "";
      render();
    }

    function preferenceCopy() {
      const product = EMAIL_PRODUCTS[preferenceProduct];
      if (preferenceOutcome === "opt-down") return ["Opted down", `${product.name} stays on, at most once a week. The full unsubscribe was replaced.`];
      if (preferenceOutcome === "channel") return ["Subscribed to another channel", `You remain unsubscribed from ${product.name} by email. ${preferenceChannel} is now on for this product.`];
      return ["Unsubscribed", `You will no longer receive ${product.name} by email. Your other subscriptions are unchanged.`];
    }

    function preferenceChoice(title, detail, { current = false, danger = false, disabled = false, onclick }) {
      return el("button", {
        type: "button",
        class: `choice${current ? " is-current" : ""}${danger ? " is-danger" : ""}`,
        "aria-pressed": current ? "true" : "false",
        disabled: disabled ? "" : null,
        onclick
      }, [el("strong", {}, title), el("span", {}, detail)]);
    }

    function productStatus(item) {
      if (item.paused) return ["Paused", "is-warn"];
      if (item.reduced) return ["Fewer", "is-warn"];
      if (item.subscribed) return ["On", "is-on"];
      return ["Off", ""];
    }

    function productControls(item) {
      const [label] = productStatus(item);
      return [
        preferenceChoice("Get fewer", "Major developments only, or weekly max", {
          current: label === "Fewer",
          onclick: () => { item.subscribed = true; item.reduced = true; item.paused = false; item.cadence = "Weekly"; render(); }
        }),
        preferenceChoice("Pause", "Take a break. Resume anytime.", {
          current: label === "Paused",
          onclick: () => { item.subscribed = true; item.paused = true; item.reduced = false; render(); }
        }),
        preferenceChoice("Resume", "Turn this back on now", {
          current: false,
          disabled: !item.paused,
          onclick: () => { item.paused = false; item.subscribed = true; render(); }
        }),
        preferenceChoice("Stop this newsletter", "Doesn’t affect your other emails or push.", {
          current: label === "Off",
          danger: true,
          onclick: () => { item.subscribed = false; item.reduced = false; item.paused = false; item.cadence = item.base; render(); }
        })
      ];
    }

    function focusedCard(product) {
      const optedDown = preferenceOutcome === "opt-down";
      const status = optedDown ? "Fewer" : "Off";
      return el("article", { class: "sub-card is-pilot is-expanded" }, [
        el("div", { class: "sub-main" }, [
          el("div", {}, [
            el("p", { class: "sub-kicker" }, "From this email"),
            el("h2", { class: "sub-title" }, product.name),
            el("p", { class: "sub-blurb" }, product.blurb),
            el("div", { class: "sub-meta" }, [
              el("span", {}, "Email"),
              el("span", {}, optedDown ? "Weekly" : product.base),
              el("span", { class: optedDown ? "is-on" : "" }, status)
            ])
          ])
        ]),
        el("div", { class: "sub-panel" }, [
          preferenceChoice("Get fewer", "Keep this email, at most once a week.", { current: optedDown, onclick: optDownInstead }),
          preferenceChoice("Get this by SMS", "Same product, as a text instead of this email.", { current: preferenceChannel === "SMS", onclick: () => subscribeChannel("SMS") }),
          preferenceChoice("Get this by WhatsApp", "Same product, on WhatsApp instead of this email.", { current: preferenceChannel === "WhatsApp", onclick: () => subscribeChannel("WhatsApp") }),
          preferenceChoice("Stop this newsletter", "Doesn’t affect your other emails or push.", { current: !product.subscribed, danger: true, onclick: stopThisProduct })
        ])
      ]);
    }

    function renderPreferences() {
      const [title, detail] = preferenceCopy();
      const product = EMAIL_PRODUCTS[preferenceProduct];
      const scroll = prefsEl.scrollTop;
      const query = prefsQuery.trim().toLowerCase();
      const others = Object.values(EMAIL_PRODUCTS).filter(item => item.id !== product.id && item.subscribed && (!query || `${item.name} ${item.blurb}`.toLowerCase().includes(query)));
      const discover = Object.values(EMAIL_PRODUCTS).filter(item => item.id !== product.id && !item.subscribed);
      const emailCount = Object.values(EMAIL_PRODUCTS).filter(item => item.subscribed).length;
      const textCount = Object.values(textChannels).filter(channel => channel.on).length;
      prefsEl.replaceChildren(
        el("button", { type: "button", class: "up-back", onclick: () => { view = preferenceReturn; render(); } }, "Back to email"),
        el("section", { class: "up-lead" }, [
          el("p", { class: "up-brand" }, "The New York Times · Account"),
          el("h1", {}, "Your updates"),
          el("p", { class: "up-lede" }, "When you have a long list, we keep a few front and center — and tuck the rest into a drawer so nothing feels like an endless stack."),
          el("div", { class: "up-success", role: "status" }, [el("strong", {}, title), el("p", {}, detail)]),
          focusedCard(product)
        ]),
        el("section", { class: "up-rest" }, [
          el("div", { class: "snapshot" }, [
            el("span", {}, [el("em", {}, String(emailCount)), ` email newsletter${emailCount === 1 ? "" : "s"}`]),
            el("span", {}, pushOn ? [el("em", {}, "Push"), " on"] : "Push off"),
            el("span", {}, textCount ? [el("em", {}, String(textCount)), ` text channel${textCount === 1 ? "" : "s"}`] : "Text · beta · none yet")
          ]),
          el("p", { class: "section-label" }, "Email newsletters"),
          el("p", { class: "section-note" }, "Everything else nests here. Open one row at a time to manage it."),
          el("div", { class: "find-row" }, el("input", {
            type: "search",
            placeholder: "Find a newsletter",
            value: prefsQuery,
            "aria-label": "Find a newsletter",
            oninput: event => {
              prefsQuery = event.target.value;
              const caret = event.target.selectionStart;
              render();
              const input = prefsEl.querySelector(".find-row input");
              if (input) { input.focus(); input.setSelectionRange(caret, caret); }
            }
          })),
          el("div", { class: `drawer${prefsDrawerOpen ? " is-open" : ""}` }, [
            el("button", {
              type: "button",
              class: "drawer-toggle",
              "aria-expanded": prefsDrawerOpen ? "true" : "false",
              onclick: () => { prefsDrawerOpen = !prefsDrawerOpen; render(); }
            }, [
              el("div", {}, [
                el("strong", {}, others.length === 1 ? "1 more email newsletter" : `${others.length} more email newsletters`),
                el("span", {}, "Compact list — tap a row to manage")
              ]),
              el("span", { class: "drawer-chevron" }, prefsDrawerOpen ? "Hide" : "Show")
            ]),
            el("div", { class: "drawer-body" }, others.map(item => {
              const [label, tone] = productStatus(item);
              const open = prefsExpandedId === item.id;
              return el("div", { class: `compact-row${open ? " is-expanded" : ""}` }, [
                el("button", { type: "button", class: "compact-main", onclick: () => { prefsExpandedId = open ? null : item.id; render(); } }, [
                  el("div", {}, [
                    el("p", { class: "compact-title" }, item.name),
                    el("p", { class: "compact-meta" }, [`${item.cadence} · `, el("span", { class: tone }, label)])
                  ]),
                  el("span", { class: "compact-cta" }, open ? "Close" : "Manage")
                ]),
                el("div", { class: "compact-panel" }, productControls(item))
              ]);
            }))
          ]),
          el("p", { class: "section-label" }, "Push notifications"),
          el("p", { class: "section-note" }, "One general opt-in. Not interest-based by topic."),
          el("article", { class: "sub-card" }, [
            el("div", { class: "sub-main" }, [
              el("div", {}, [
                el("p", { class: "sub-kicker" }, "App · general"),
                el("h2", { class: "sub-title" }, "Push notifications"),
                el("p", { class: "sub-blurb" }, "Alerts from The Times app — breaking news and time-sensitive notices."),
                el("div", { class: "sub-meta" }, [el("span", {}, "Push"), el("span", { class: pushOn ? "is-on" : "" }, pushOn ? "On" : "Off")])
              ]),
              el("button", { type: "button", class: "push-manage", onclick: () => { pushOn = !pushOn; render(); } }, pushOn ? "Turn off" : "Turn on")
            ])
          ]),
          el("p", { class: "section-label" }, ["Text messages", el("span", { class: "beta-tag" }, "Beta")]),
          el("p", { class: "section-note" }, "SMS, MMS, WhatsApp, and RCS. Opting in records interest; these are not sending at scale yet."),
          ...Object.entries(textChannels).map(([id, channel]) => el("div", { class: "text-row" }, [
            el("div", {}, [
              el("strong", {}, [channel.title, el("span", { class: "beta-tag" }, "Beta")]),
              el("span", {}, channel.blurb),
              el("p", { class: "door" }, channel.on ? "Interest recorded — no texts sending yet." : "Off · tap to register interest")
            ]),
            el("button", {
              type: "button",
              class: channel.on ? "is-on" : "",
              onclick: () => {
                channel.on = !channel.on;
                if ((id === "SMS" || id === "WhatsApp") && channel.on) subscribeChannel(id);
                else if (preferenceChannel === id && !channel.on) {
                  preferenceChannel = "";
                  preferenceOutcome = EMAIL_PRODUCTS[preferenceProduct].subscribed ? "opt-down" : "unsubscribed";
                  render();
                } else render();
              }
            }, channel.on ? "Turn off" : "Opt in")
          ])),
          el("div", { class: "discover-head" }, [el("h2", {}, "Discover more"), el("p", {}, "Email newsletters you can add")]),
          ...discover.map(item => {
            const open = prefsDiscoverId === item.id;
            return el("div", {}, [
              el("button", {
                type: "button",
                class: `discover-card${open ? " is-open" : ""}`,
                onclick: () => { prefsDiscoverId = open ? null : item.id; render(); }
              }, [
                el("div", { class: `discover-thumb ${item.tone || "tone-a"}` }, item.thumb || item.name),
                el("div", { class: "discover-copy" }, [el("strong", {}, item.name), el("span", {}, item.blurb)]),
                el("span", { class: "discover-cta" }, open ? "Close" : "See more")
              ]),
              open ? el("div", { class: "discover-panel" }, [
                el("p", {}, "Adds an email newsletter only. Push stays general — not interest-based."),
                el("button", { type: "button", class: "push-manage", onclick: () => { item.subscribed = true; item.cadence = item.base; prefsDiscoverId = null; prefsDrawerOpen = true; render(); } }, "Get by email")
              ]) : null
            ]);
          })
        ])
      );
      prefsEl.scrollTop = scroll;
    }

    function render() {
      rememberSession();
      screenEl.dataset.view = view;
      launcherEl.hidden = view !== "home";
      inboxEl.hidden = view !== "list";
      conversationEl.hidden = view !== "thread";
      prefsEl.hidden = view !== "prefs";
      if (view === "prefs") {
        screenEl.dataset.channel = "email";
        renderPreferences();
        return;
      }
      if (view === "home") {
        screenEl.dataset.channel = "home";
        return;
      }
      const channel = channelConfig();
      screenEl.dataset.channel = channel.key;
      if (view === "list") {
        renderInbox();
        return;
      }
      contactNameEl.textContent = channel.key === "email" ? "Paris, when you need it" : "The Times";
      statusEl.textContent = statusCopy();
      statusEl.dataset.state = service.state;
      composer.placeholder = channel.placeholder;
      composer.disabled = busy;
      renderThread();
      renderChips();
      renderDesk();
    }

    async function answer(text) {
      busy = true;
      thread.push({ type: "pending" });
      render();
      try {
        const queries = planQueries(text);
        const data = await retrieve(queries);
        const pending = thread.findIndex(message => message.type === "pending");
        if (pending >= 0) thread.splice(pending, 1);
        const articles = merge(data.searches);
        latest = { data, articles };
        thread.push({ type: "brief", data, articles, mode: "brief" });
        const automate = wantsFollowUp(text) && service.state !== "active" && service.state !== "paused";
        if (automate) {
          service.scope = text.toLowerCase().includes("paris") ? "Paris trip — must-sees, local recommendations, and disruptions that could affect plans" : "The subject of this question";
          beginAutomation();
        } else if (service.state === "none" || service.state === "cancelled") {
          thread.push({ type: "times", text: `This stays a one-time answer. I have not started ${channelConfig().plural} for a period.` });
        }
        if (!automate) addLog("Answer only", `${articles.length} stories retrieved. No recurring send.`);
      } catch (error) {
        const index = thread.findIndex(message => message.type === "pending");
        if (index >= 0) thread.splice(index, 1);
        thread.push({ type: "times", text: error.message });
      } finally {
        busy = false;
        render();
      }
    }

    async function runCheck() {
      busy = true;
      thread.push({ type: "pending" });
      render();
      try {
        const data = await retrieve(["paris protests", "paris transit"]);
        const pending = thread.findIndex(message => message.type === "pending");
        if (pending >= 0) thread.splice(pending, 1);
        const all = merge(data.searches);
        const articles = all.filter(article => canText(article, data.now));
        latest = { data, articles: all };
        thread.push({ type: "update", articles, now: data.now });
        addLog(articles.length ? "Send" : "No send", articles.length ? `${articles.length} stories inside the window.` : "No retrieved story inside the window.");
      } catch (error) {
        const index = thread.findIndex(message => message.type === "pending");
        if (index >= 0) thread.splice(index, 1);
        thread.push({ type: "times", text: error.message });
      } finally {
        busy = false;
        render();
      }
    }

    async function send(raw) {
      const text = raw.trim();
      if (!text || busy) return;
      thread.push({ type: "reader", text });
      composer.value = "";
      const value = text.toLowerCase();
      if ((service.state === "active" || service.state === "paused") && /\b(?:just this answer|one time|one-time|do not text|don't text|dont text)\b/.test(value)) {
        chooseOneTime(true);
        return;
      }
      if ((service.state === "active" || service.state === "paused") && /\b(?:stop|cancel|unsubscribe)\b/.test(value)) {
        stopService();
        return;
      }
      if (service.state === "active" && /\bpause\b/.test(value)) {
        pauseService();
        return;
      }
      if (service.state === "paused" && /\bresume\b/.test(value)) {
        resumeService();
        return;
      }
      if ((service.state === "active" || service.state === "paused") && /\bless often\b/.test(value)) {
        lessen();
        return;
      }
      if (service.state === "active" && /\b(?:what changed|anything new|meaningful update|check again)\b/.test(value)) {
        await runCheck();
        return;
      }
      render();
      await answer(text);
    }

    document.querySelector("#form").addEventListener("submit", event => {
      event.preventDefault();
      send(composer.value);
    });
    composer.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send(composer.value);
      }
    });
    windowInput.addEventListener("change", () => {
      const next = Number(windowInput.value);
      if (next >= 1 && next <= 365) windowDays = next;
      render();
    });
    const sheet = document.querySelector("#sheet");
    const info = document.querySelector("#info");
    info.addEventListener("click", () => {
      sheet.hidden = !sheet.hidden;
      info.setAttribute("aria-expanded", String(!sheet.hidden));
    });
    document.querySelector("#sheet-close").addEventListener("click", () => {
      sheet.hidden = true;
      info.setAttribute("aria-expanded", "false");
    });
    document.querySelector("#back").addEventListener("click", goBack);
    document.querySelectorAll("[data-open]").forEach(button => {
      button.addEventListener("click", () => openApp(button.dataset.open));
    });
    render();
  </script>
</body>
</html>
